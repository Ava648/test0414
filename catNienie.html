<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貓貓旅館</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
    <button class="menu">&#9776;</button>
    <h1>貓貓旅館</h1>
    <nav>
    <ul>
        <li><a href="#">環境介紹</a></li>
        <li><a href="#">服務項目</a></li>
        <li><a href="#">領養分享</a></li>
        <li><a href="#">購物車</a></li>                
    </ul>
    </nav>  
    </header>   
    <main>

    <section class="news">
    <h2>店貓介紹</h2>
    <p>我喜歡人類，尤其是男性賀爾蒙多的</p>
    <img src="image/妮妮.jpg" alt="妮妮">
    </section>

    <section class="slogan">
    <blockquote>" 貓咪至上<br>世界上不能沒有貓貓 "</blockquote>
    </section>
    
    <section class="shop">
    <img src="image/環境圖.png" alt="環境照片">
    <div class="info">
    <h2>本店貓咪至上</h2>
    <p>貓咪盡情釋放天性，享受如叢林般世界，<br>
       即日起來店消費加 LINE 好友可獲精緻小點心！</p>
    </div>
    </section>

    <section class="product">
        <div>
            <img src="image/小房間.png" alt="精緻小房間">
            <h3>六款房間造型</h3>
            <p>金蛇呈祥、歐式宮廷、花園、童話森林、彩虹、度假風</p>
        </div>
        <div>
            <img src="image/大房間.png" alt="精緻大房間">
            <h3>六款房間造型</h3>
            <p>金蛇呈祥、歐式宮廷、花園、童話森林、彩虹、度假風</p>
        </div>
        <div>
            <img src="images/p3.png" alt="組合式小房間">
            <h3>兩款房間造型</h3>
            <p>歐式宮廷、童話森林</p>
        </div>
        <div>
            <img src="images/p3.png" alt="組合式大房間">
            <h3>兩款房間造型</h3>
            <p>歐式宮廷、童話森林</p>
        </div>
    </section>
    <section class="local">
        <img src="image/地圖.png" alt="地點">
        <p>停車位置和臨停區</p>
    </section>
    </main>
    <footer>
        <p>加入我們的LINE.</p>
    </footer>
</body>
</html>
